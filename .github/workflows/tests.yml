name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            testbench: '9.*'
            laravel: '11'
          - php: '8.4'
            testbench: '9.*'
            laravel: '11'
          - php: '8.3'
            testbench: '10.*'
            laravel: '12'
          - php: '8.4'
            testbench: '10.*'
            laravel: '12'
          - php: '8.3'
            testbench: '11.*'
            laravel: '13'
          - php: '8.4'
            testbench: '11.*'
            laravel: '13'

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip
          coverage: none

      - name: Install dependencies
        run: |
          composer require "orchestra/testbench=${{ matrix.testbench }}" --dev --no-interaction --no-update
          composer update --prefer-dist --prefer-stable --no-interaction

      - name: Run tests
        run: vendor/bin/pest
